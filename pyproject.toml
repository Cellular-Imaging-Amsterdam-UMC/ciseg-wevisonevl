[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ciseg-wevisonevl"
version = "0.1.0"
description = "CISegWeVisOneVL: four-prompt OME-Zarr segmentation with automatic Max/Mean Z projection, time series and HCS screens"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["ciseg_wevisonevl*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
