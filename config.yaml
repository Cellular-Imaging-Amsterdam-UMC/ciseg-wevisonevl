citations:
- name: CISegWeVisOneVL
  doi: https://github.com/Cellular-Imaging-Amsterdam-UMC/ciseg-wevisonevl
  license: MIT
  description: CISegWeVisOneVL uses WeVisOne-VL-4B to segment OME-Zarr images with
    up to four text prompts. 3D images are automatically projected to 2D per timepoint
    using Max (default) or Mean. Supports time series and HCS screens and writes one
    CSV with basic shape and per-channel intensity measurements. Whole-field pyramid
    overview inference (maximum side 4096) replaces tile-by-tile segmentation; labels
    are smoothly restored to native dimensions and CSV measurements are scaled from
    the overview.
- name: WeVisOne-VL
  doi: https://github.com/Tencent/WeVisOne-VL
  license: Apache-2.0
  description: Unified Visual Perception from Objects to Pixels (Liang et al., 2026).
docker_image:
  org: cellularimagingcf
  name: w_cisegwevisonevl
  tag: v0.2.0
  platform: linux/amd64
algorithm_folder_name: CISegWeVisOneVL
exec_function:
  name: generate_cli_command
  cli_command: python wrapper.py
  hidden_args:
  - cli_tag: --local
    value: 'true'
    append_value: false
    cli_order: 3
inputs:
- name: infolder
  type: image
  label: Input 2D OME-Zarrs
  description: NGFF 0.4 / Zarr v2 images or HCS plates. Z stacks are projected per
    timepoint using Max or Mean.
  cli_tag: --infolder
  cli_order: 1
  default: directory
  optional: false
  format:
  - zarr
  unique_string:
  - .ome.zarr
  folder_name: /data/in
  file_count: multiple
  section_id: inputs
  mode: beginner
  subtype:
  - grayscale
  - color
  depth: true
  timepoints: true
  tiled: true
  pyramidal: true
outputs:
- name: outfolder
  type: image
  label: CISegWeVisOneVL results
  description: 2D images or Z projections for every timepoint with independent prompt
    labels. Source stores remain unchanged.
  cli_tag: --outfolder
  cli_order: 2
  default: directory
  optional: false
  format:
  - zarr
  unique_string:
  - .ome.zarr
  folder_name: /data/out
  file_count: multiple
  section_id: outputs
  mode: beginner
  subtype:
  - label
  depth: false
  timepoints: true
  tiled: true
  pyramidal: true
- name: measurements_csv_out
  type: measurement
  label: Basic label measurements CSV
  description: One measurements.csv across all fields and timepoints. Shapes are measured
    on the working overview and transformed to native pixel coordinates and calibrated
    physical units. Area, valid pixel counts and total intensity scale by Y*X. Mean/min/max
    intensities are overview values. These are estimates, not native-resolution remeasurements;
    scale and method are recorded.
  cli_tag: None
  default: ''
  optional: false
  format:
  - csv
  unique_string:
  - measurements.csv
  folder_name: /data/out
  file_count: single
  section_id: outputs
  mode: beginner
display_only: []
parameters:
- name: auto_resolution
  type: dropdown
  label: Overview resolution
  description: Choose a conservative profile using the actual assigned GPU/MIG capacity
    and current free memory. 24 GB starts at 3072; 47 GB starts at 4096, within the
    configured maximum. Configured limit tries the maximum directly. Both modes retry
    a smaller overview after CUDA out-of-memory and record actual resolution and scaling.
  options:
  - label: Automatic GPU profile (recommended)
    value: 1
  - label: Use configured limit with memory fallback
    value: 0
  default: 1
  cli_tag: --auto-resolution
  cli_order: 46
  optional: true
  section_id: advanced
  mode: advanced
- name: release_gpu_cache
  type: dropdown
  label: GPU memory between calls
  description: Release unused GPU cache after each model call, including failures.
    Model weights stay loaded; per-prompt reports record cleanup.
  options:
  - label: Release unused cache (shared GPU)
    value: 1
  - label: Reuse cache (dedicated GPU)
    value: 0
  default: 1
  cli_tag: --release-gpu-cache
  cli_order: 45
  optional: true
  section_id: advanced
  mode: advanced
- name: overwrite
  type: dropdown
  label: Existing results
  description: Replace matching result stores and measurements.csv in the selected
    output folder after a successful run. A failed run keeps the previous completed
    results. Input images and unrelated files are preserved.
  options:
  - label: Replace after successful run
    value: 1
  - label: Keep existing results
    value: 0
  default: 1
  cli_tag: --overwrite
  cli_order: 38
  optional: true
  section_id: advanced
  mode: advanced
- name: projection
  type: dropdown
  label: Z projection
  description: Automatically project 3D inputs along Z for every channel and timepoint.
    Max preserves pixel dtype; Mean writes float32. 2D inputs are unchanged.
  options:
  - label: Max
    value: Max
  - label: Mean
    value: Mean
  default: Max
  cli_tag: --projection
  cli_order: 37
  optional: true
  section_id: advanced
  mode: advanced
- name: prompt_1
  type: string
  label: 1 â€” Prompt
  description: English target description. Blank disables this slot.
  default: ''
  cli_tag: --prompt-1
  cli_order: 11
  optional: true
  section_id: essential
  mode: beginner
- name: name_1
  type: string
  label: 1 â€” Label name
  description: Unique output label name.
  default: target1
  cli_tag: --name-1
  cli_order: 12
  optional: true
  section_id: essential
  mode: beginner
- name: channels_1
  type: string
  label: 1 â€” Channels
  description: One RGB model image per target. Enter one channel (1) for grayscale,
    or exactly three channels (1,2,3) mapped to R,G,B in that order. No separate per-channel
    inference; other channels are excluded from the model view but retained for measurements.
  default: '1'
  cli_tag: --channels-1
  cli_order: 13
  optional: true
  section_id: essential
  mode: beginner
- name: prompt_2
  type: string
  label: 2 â€” Prompt
  description: Blank disables this slot.
  default: ''
  cli_tag: --prompt-2
  cli_order: 14
  optional: true
  section_id: essential
  mode: beginner
- name: name_2
  type: string
  label: 2 â€” Label name
  default: target2
  cli_tag: --name-2
  cli_order: 15
  optional: true
  section_id: essential
  mode: beginner
- name: channels_2
  type: string
  label: 2 â€” Channels
  description: One RGB model image per target. Enter one channel (1) for grayscale,
    or exactly three channels (1,2,3) mapped to R,G,B in that order. No separate per-channel
    inference; other channels are excluded from the model view but retained for measurements.
  default: '1'
  cli_tag: --channels-2
  cli_order: 16
  optional: true
  section_id: essential
  mode: beginner
- name: prompt_3
  type: string
  label: 3 â€” Prompt
  description: Blank disables this slot.
  default: ''
  cli_tag: --prompt-3
  cli_order: 17
  optional: true
  section_id: essential
  mode: beginner
- name: name_3
  type: string
  label: 3 â€” Label name
  default: target3
  cli_tag: --name-3
  cli_order: 18
  optional: true
  section_id: essential
  mode: beginner
- name: channels_3
  type: string
  label: 3 â€” Channels
  description: One RGB model image per target. Enter one channel (1) for grayscale,
    or exactly three channels (1,2,3) mapped to R,G,B in that order. No separate per-channel
    inference; other channels are excluded from the model view but retained for measurements.
  default: '1'
  cli_tag: --channels-3
  cli_order: 19
  optional: true
  section_id: essential
  mode: beginner
- name: prompt_4
  type: string
  label: 4 â€” Prompt
  description: Blank disables this slot.
  default: ''
  cli_tag: --prompt-4
  cli_order: 20
  optional: true
  section_id: essential
  mode: beginner
- name: name_4
  type: string
  label: 4 â€” Label name
  default: target4
  cli_tag: --name-4
  cli_order: 21
  optional: true
  section_id: essential
  mode: beginner
- name: channels_4
  type: string
  label: 4 â€” Channels
  description: One RGB model image per target. Enter one channel (1) for grayscale,
    or exactly three channels (1,2,3) mapped to R,G,B in that order. No separate per-channel
    inference; other channels are excluded from the model view but retained for measurements.
  default: '1'
  cli_tag: --channels-4
  cli_order: 22
  optional: true
  section_id: essential
  mode: beginner
- name: input_labels
  type: dropdown
  label: Existing input labels
  description: Keep existing label groups from 2D inputs in the output alongside the
    new predictions, or omit all existing input label groups from the output. The
    input store is never changed. Labels from Z stacks are omitted when projecting
    to 2D; instance IDs are never projected. With Keep, choose a different label name
    if it already exists. With Remove, the same name can be recomputed.
  options:
  - label: Keep existing labels
    value: keep
  - label: Remove existing labels from result
    value: remove
  default: keep
  cli_tag: --input-labels
  cli_order: 29
  optional: true
  section_id: essential
  mode: beginner
- name: normalization
  type: dropdown
  label: Model RGB view - intensity scaling
  description: Each target sees one RGB view from the selected grayscale channel or
    three channels mapped to R,G,B. Percentile stretches each channel independently.
    Full data-type range uses 0-255 for 8-bit or 0-65535 for 16-bit input, mapped
    to the model's 8-bit RGB view without per-channel contrast stretching. OME-Zarr
    metadata uses each selected channel's saved window.start and window.end; missing
    or invalid windows fail Check input. Only intensity limits are read from metadata;
    your explicit channel mapping is retained. Original source pixels and measurement
    intensities are sampled from the unscaled pyramid overview.
  options:
  - label: Stretch each selected channel (1-99.8 percentile)
    value: percentile
  - label: Full data-type range (8-bit / 16-bit)
    value: dtype
  - label: Use OME-Zarr metadata display windows
    value: metadata
  default: percentile
  cli_tag: --normalization
  cli_order: 30
  optional: true
  section_id: essential
  mode: beginner
- name: label_mode
  type: dropdown
  label: Label output
  description: Instances retain one ID per predicted object. Semantic merges objects
    within each prompt. Prompt groups can overlap.
  options:
  - label: Instance IDs
    value: instances
  - label: Semantic binary mask
    value: semantic
  default: instances
  cli_tag: --label-mode
  cli_order: 31
  optional: true
  section_id: advanced
  mode: advanced
- name: threshold
  type: float
  label: Mask probability threshold
  default: 0.5
  minimum: 0.01
  maximum: 0.99
  cli_tag: --threshold
  cli_order: 32
  optional: true
  section_id: advanced
  mode: advanced
- name: max_side
  type: integer
  label: Maximum overview side (pixels)
  description: Resolution ceiling, default 4096. Automatic GPU profiles normally use
    3072 on 24 GB and 4096 on 47 GB; free memory can lower this. Configured-limit
    mode permits a side up to 4096. CUDA out-of-memory retries use a smaller whole-field
    overview. Larger views are not guaranteed to fit or improve masks.
  default: 4096
  minimum: 128
  maximum: 4096
  cli_tag: --max-side
  cli_order: 33
  optional: true
  section_id: advanced
  mode: advanced
- name: max_new_tokens
  type: integer
  label: Maximum generated tokens
  description: Truncated output fails the run instead of silently saving partial masks.
  default: 2048
  minimum: 32
  maximum: 8192
  cli_tag: --max-new-tokens
  cli_order: 34
  optional: true
  section_id: advanced
  mode: advanced
- name: min_area
  type: integer
  label: Minimum object area (native pixels)
  default: 0
  minimum: 0
  maximum: 16777216
  cli_tag: --min-area
  cli_order: 35
  optional: true
  section_id: advanced
  mode: advanced
- name: device
  type: dropdown
  label: Compute device
  options:
  - label: Auto
    value: auto
  - label: NVIDIA GPU
    value: cuda:0
  - label: CPU (slow)
    value: cpu
  default: auto
  cli_tag: --device
  cli_order: 36
  optional: true
  section_id: advanced
  mode: advanced
